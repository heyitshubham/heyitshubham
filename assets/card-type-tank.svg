<svg xmlns="http://www.w3.org/2000/svg" width="460" height="210" viewBox="0 0 460 210" role="img" aria-label="TYPE//TANK: A retro DOS typing-defense game: CRT glow, a 180° rotating cannon and sound synthesized in Web Audio.">
  <style>.m{font-family:'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39ff7a" stop-opacity=".16"/><stop offset=".55" stop-color="#39ff7a" stop-opacity="0"/></linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#000" opacity=".35"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="458" height="208" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="1" y="1" width="458" height="208" rx="14" fill="#0d1117"/>
    <rect x="1" y="1" width="458" height="208" rx="14" fill="url(#glow)"/>
    <rect x="1" y="1" width="5" height="208" fill="#39ff7a"/>
    <rect x="1" y="1" width="458" height="208" rx="14" fill="url(#scan)"/><rect x="1" y="-30" width="458" height="30" fill="#39ff7a" opacity=".06"><animate attributeName="y" values="-30;210" dur="3.5s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="458" height="208" rx="14" fill="none" stroke="#30363d"/>
  <text x="28" y="40" class="m" fill="#39ff7a" style="font-size:11px;letter-spacing:1.5px">SIDE QUEST · ZERO DEPENDENCIES</text>
  <text x="28" y="78" class="m" fill="#e6edf3" style="font-size:26px;font-weight:800;letter-spacing:2px">TYPE//TANK</text>
  <text x="28" y="110" class="s" fill="#8b949e" style="font-size:14px">A retro DOS typing-defense game: CRT glow, a 180°</text>
  <text x="28" y="132" class="s" fill="#8b949e" style="font-size:14px">rotating cannon and sound synthesized in Web Audio.</text>
  <rect x="28" y="160" width="96" height="26" rx="13" fill="#39ff7a" fill-opacity=".12" stroke="#39ff7a" stroke-opacity=".45"/><text x="76" y="177" text-anchor="middle" class="m" fill="#39ff7a" style="font-size:12px">Vanilla JS</text><rect x="132.0" y="160" width="66" height="26" rx="13" fill="#39ff7a" fill-opacity=".12" stroke="#39ff7a" stroke-opacity=".45"/><text x="165" y="177" text-anchor="middle" class="m" fill="#39ff7a" style="font-size:12px">Canvas</text><rect x="206.4" y="160" width="89" height="26" rx="13" fill="#39ff7a" fill-opacity=".12" stroke="#39ff7a" stroke-opacity=".45"/><text x="251" y="177" text-anchor="middle" class="m" fill="#39ff7a" style="font-size:12px">Web Audio</text>
  <text x="434" y="40" text-anchor="end" class="m" fill="#8b949e" style="font-size:16px">↗</text>
</svg>
