e attributeName="opacity" values="0;0;1" keyTimes="0;0.8923;1" dur="3.25s" fill="freeze"/><rect x="744" y="190" width="176" height="40" rx="8" fill="#161b22" stroke="#30363d"/><circle cx="762" cy="210" r="4" fill="#8b949e"><animate attributeName="opacity" values="1;.35;1" dur="1.9s" repeatCount="indefinite"/></circle><text x="776" y="215" class="m" fill="#8b949e">service-06</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8968;1" dur="3.39s" fill="freeze"/><rect x="360" y="242" width="176" height="40" rx="8" fill="#161b22" stroke="#30363d"/><circle cx="378" cy="262" r="4" fill="#8b949e"><animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="392" y="267" class="m" fill="#8b949e">service-07</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9008;1" dur="3.5300000000000002s" fill="freeze"/><rect x="552" y="242" width="176" height="40" rx="8" fill="#161b22" stroke="#30363d"/><circle cx="570" cy="262" r="4" fill="#8b949e"><animate attributeName="opacity" values="1;.35;1" dur="2.5s" repeatCount="indefinite"/></circle><text x="584" y="267" class="m" fill="#8b949e">service-08</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9046;1" dur="3.67s" fill="freeze"/><rect x="744" y="242" width="176" height="40" rx="8" fill="#161b22" stroke="#30363d"/><circle cx="762" cy="262" r="4" fill="#8b949e"><animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="776" y="267" class="m" fill="#8b949e">service-09</text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8750;1" dur="4.0s" fill="freeze"/>
    <rect x="360" y="306" width="560" height="30" rx="15" fill="url(#bus)" stroke="#30363d"/>
    <circle r="4" fill="#3fb950"><animateMotion dur="3.2s" begin="0s" repeatCount="indefinite" path="M370,321 H910"/></circle><circle r="4" fill="#d29922"><animateMotion dur="4.1s" begin="1.1s" repeatCount="indefinite" path="M370,321 H910"/></circle><circle r="4" fill="#58a6ff"><animateMotion dur="3.6s" begin="2.0s" repeatCount="indefinite" path="M370,321 H910"/></circle><circle r="4" fill="#ff7b72"><animateMotion dur="4.6s" begin="0.6s" repeatCount="indefinite" path="M370,321 H910"/></circle><circle r="3" fill="#bc8cff" opacity=".8"><animateMotion dur="3.9s" begin="0.4s" repeatCount="indefinite" path="M910,321 H370"/></circle><circle r="3" fill="#58a6ff" opacity=".8"><animateMotion dur="5.0s" begin="1.7s" repeatCount="indefinite" path="M910,321 H370"/></circle>
    <text x="640.0" y="358" text-anchor="middle" class="m" fill="#8b949e" style="font-size:12px">events over KAFKA + AMAZON SQS · JUnit + Mockito guarding every step</text>
