<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="A legacy monolith split into nine Spring Boot microservices, behind an API gateway with circuit breakers, talking over Kafka and Amazon SQS.">
  <style>.m{font-family:'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style>
  <defs>
    <linearGradient id="mono" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d333b"/><stop offset="1" stop-color="#1c2128"/></linearGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb950" stop-opacity=".18"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".18"/><stop offset="1" stop-color="#bc8cff" stop-opacity=".18"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="378" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="34" y="44" class="m" fill="#8b949e">// strangler fig, one release at a time</text>
  <text x="926" y="44" text-anchor="end" class="m" fill="#8b949e">day job · high-volume e-commerce platform</text>

  <!-- monolith: cracks, then fades as the services take over -->
  <g>
    <animate attributeName="opacity" values="1;1;.45" keyTimes="0;.6;1" dur="2.6s" fill="freeze"/>
    <rect x="60" y="96" width="190" height="226" rx="10" fill="url(#mono)" stroke="#444c56"/>
    <text x="155" y="128" text-anchor="middle" class="m" fill="#e6edf3" font-weight="700">MONOLITH</text>
    <text x="155" y="148" text-anchor="middle" class="m" fill="#8b949e" style="font-size:12px">legacy · one deploy</text>
    <g stroke="#444c56" stroke-width="1">
      <path d="M80 170 H230 M80 196 H230 M80 222 H230 M80 248 H230 M80 274 H230 M80 300 H230" />
      <path d="M118 170 V300 M156 196 V274 M196 170 V300" stroke-dasharray="2 4"/>
    </g>
    <path d="M140 96 L160 150 L138 200 L170 250 L150 322" fill="none" stroke="#ff7b72" stroke-width="2.5"
          stroke-dasharray="260" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="260;260;0" keyTimes="0;.45;1" dur="1.6s" fill="freeze"/>
    </path>
  </g>

  <path d="M266 209 H340" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="22" to="0" dur=".8s" repeatCount="indefinite"/>
  </path>
  <text x="303" y="196" text-anchor="middle" class="m" fill="#58a6ff" style="font-size:12px">split</text>

  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7619;1" dur="2.1s" fill="freeze"/>
    <rect x="360" y="74" width="560" height="40" rx="8" fill="#161b22" stroke="#bc8cff"/>
    <text x="378" y="99" class="m" fill="#bc8cff" font-weight="700">API GATEWAY</text>
    <text x="902" y="99" text-anchor="end" class="m" fill="#8b949e" style="font-size:12px">service discovery · resilience4j ⚡</text>
  </g>
  <line x1="448.0" y1="282" x2="448.0" y2="306" stroke="#30363d" stroke-dasharray="3 3"/><line x1="448.0" y1="114" x2="448.0" y2="138" stroke="#30363d" stroke-dasharray="3 3"/><line x1="640.0" y1="282" x2="640.0" y2="306" stroke="#30363d" stroke-dasharray="3 3"/><line x1="640.0" y1="114" x2="640.0" y2="138" stroke="#30363d" stroke-dasharray="3 3"/><line x1="832.0" y1="282" x2="832.0" y2="306" stroke="#30363d" stroke-dasharray="3 3"/><line x1="832.0" y1="114" x2="832.0" y2="138" stroke="#30363d" stroke-dasharray="3 3"/>
